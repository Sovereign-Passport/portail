<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant icon — options</title>
<style>
  body { margin:0; background:#14171c; color:#eee; font-family:'Georgia',serif;
         padding:34px 18px; text-align:center; }
  h1 { font-size:16px; font-weight:400; letter-spacing:.14em; text-transform:uppercase; color:#c9a961; }
  p.sub { color:#999; font-style:italic; font-size:12.5px; margin-top:6px; }
  .grid { display:flex; flex-wrap:wrap; gap:26px; justify-content:center; margin-top:28px; }
  .opt { width:150px; }
  .big, .badge {
    display:flex; align-items:center; justify-content:center; color:#c9a961;
    border:1px solid rgba(201,169,97,.35); background:rgba(10,10,11,.85);
  }
  .big { width:96px; height:96px; border-radius:18px; margin:0 auto 10px; }
  .big svg { width:64px; height:64px; }
  .badge { width:38px; height:38px; border-radius:50%; margin:0 auto 8px;
           box-shadow:0 0 0 3px rgba(201,169,97,.12); }
  .badge svg { width:20px; height:20px; }
  .cap { font-size:12px; color:#eee; }
  .cap b { color:#c9a961; }
  svg { fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
  .dot { fill:currentColor; stroke:none; }
</style>
</head>
<body>
  <h1>Assistant icon — choisir</h1>
  <p class="sub">Dis-moi le numéro et je l'applique au badge du Passport.</p>
  <div class="grid">

    <div class="opt">
      <div class="big"><svg viewBox="0 0 24 24">
        <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
        <path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg></div>
      <div class="badge"><svg viewBox="0 0 24 24">
        <path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/>
        <path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg></div>
      <div class="cap"><b>1.</b> Robot, 1 antenne</div>
    </div>

    <div class="opt">
      <div class="big"><svg viewBox="0 0 24 24">
        <rect x="4" y="8" width="16" height="12" rx="4"/>
        <path d="M9 8V5M15 8V5"/><circle cx="9" cy="4.4" r="1"/><circle cx="15" cy="4.4" r="1"/>
        <circle class="dot" cx="9.6" cy="13" r="1"/><circle class="dot" cx="14.4" cy="13" r="1"/>
        <path d="M9.5 16c1 .9 3 .9 4 0"/></svg></div>
      <div class="badge"><svg viewBox="0 0 24 24">
        <rect x="4" y="8" width="16" height="12" rx="4"/>
        <path d="M9 8V5M15 8V5"/><circle cx="9" cy="4.4" r="1"/><circle cx="15" cy="4.4" r="1"/>
        <circle class="dot" cx="9.6" cy="13" r="1"/><circle class="dot" cx="14.4" cy="13" r="1"/>
        <path d="M9.5 16c1 .9 3 .9 4 0"/></svg></div>
      <div class="cap"><b>2.</b> Robot, 2 antennes, sourire</div>
    </div>

    <div class="opt">
      <div class="big"><svg viewBox="0 0 24 24">
        <rect x="3" y="8" width="18" height="12" rx="2"/>
        <path d="M8 8 6 3M16 8l2-5"/><circle cx="12" cy="14" r="3.2"/></svg></div>
      <div class="badge"><svg viewBox="0 0 24 24">
        <rect x="3" y="8" width="18" height="12" rx="2"/>
        <path d="M8 8 6 3M16 8l2-5"/><circle cx="12" cy="14" r="3.2"/></svg></div>
      <div class="cap"><b>3.</b> Vieille TV à antennes</div>
    </div>

    <div class="opt">
      <div class="big"><svg viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="13" rx="2.2"/>
        <path d="M12 6V3.2"/><circle cx="12" cy="2.3" r=".95"/>
        <circle class="dot" cx="9.5" cy="11" r=".6"/><circle class="dot" cx="14.5" cy="11" r=".6"/>
        <path d="M9.5 13.4c1 1 4 1 5 0"/><path d="M10 19v2.6h4V19"/></svg></div>
      <div class="badge"><svg viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="13" rx="2.2"/>
        <path d="M12 6V3.2"/><circle cx="12" cy="2.3" r=".95"/>
        <circle class="dot" cx="9.5" cy="11" r=".6"/><circle class="dot" cx="14.5" cy="11" r=".6"/>
        <path d="M9.5 13.4c1 1 4 1 5 0"/><path d="M10 19v2.6h4V19"/></svg></div>
      <div class="cap"><b>4.</b> Vieil écran + antenne + sourire</div>
    </div>

    <div class="opt">
      <div class="big"><svg viewBox="0 0 24 24">
        <circle cx="12" cy="13" r="8"/><path d="M12 5V2.2"/><circle cx="12" cy="1.6" r=".95"/>
        <circle class="dot" cx="9.2" cy="12" r=".75"/><circle class="dot" cx="14.8" cy="12" r=".75"/>
        <path d="M9.4 15.5c1.3 1.1 3.9 1.1 5.2 0"/></svg></div>
      <div class="badge"><svg viewBox="0 0 24 24">
        <circle cx="12" cy="13" r="8"/><path d="M12 5V2.2"/><circle cx="12" cy="1.6" r=".95"/>
        <circle class="dot" cx="9.2" cy="12" r=".75"/><circle class="dot" cx="14.8" cy="12" r=".75"/>
        <path d="M9.4 15.5c1.3 1.1 3.9 1.1 5.2 0"/></svg></div>
      <div class="cap"><b>5.</b> Robot rond, 1 antenne</div>
    </div>

    <div class="opt">
      <div class="big"><svg viewBox="0 0 24 24">
        <rect x="3" y="3.5" width="18" height="13.5" rx="2.2"/>
        <rect x="6.2" y="6.3" width="11.6" height="7.4" rx="1"/>
        <circle class="dot" cx="9.4" cy="9.4" r=".6"/><circle class="dot" cx="14.6" cy="9.4" r=".6"/>
        <path d="M9.4 11.3c.9 1 3.3 1 4.2 0"/>
        <line x1="7.2" y1="15.2" x2="10.8" y2="15.2"/><circle class="dot" cx="15.6" cy="15.2" r=".5"/>
        <path d="M10 17v2.6h4V17"/></svg></div>
      <div class="badge"><svg viewBox="0 0 24 24">
        <rect x="3" y="3.5" width="18" height="13.5" rx="2.2"/>
        <rect x="6.2" y="6.3" width="11.6" height="7.4" rx="1"/>
        <circle class="dot" cx="9.4" cy="9.4" r=".6"/><circle class="dot" cx="14.6" cy="9.4" r=".6"/>
        <path d="M9.4 11.3c.9 1 3.3 1 4.2 0"/>
        <line x1="7.2" y1="15.2" x2="10.8" y2="15.2"/><circle class="dot" cx="15.6" cy="15.2" r=".5"/>
        <path d="M10 17v2.6h4V17"/></svg></div>
      <div class="cap"><b>6.</b> Mac 80s (actuel)</div>
    </div>

  </div>
</body>
</html>
