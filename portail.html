<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPID — Universal Switchboard</title>
<link rel="stylesheet" href="portail.css">
</head>
<body>

  <div class="bg-wrap">
    <img src="portal-bg.png" alt="SPID Portal">
  </div>

  <div class="content">
    <div class="panel">

      <div class="brand">
        <div class="mark">SPID</div>
        <h1>Universal Switchboard</h1>
        <div class="sub">Portal to sovereign services</div>
      </div>

      <!-- Service tabs — Assist is the default active service -->
      <div class="tabs" role="tablist" aria-label="SPID services">
        <button class="tab" id="tab-assist" role="tab" type="button"
                aria-controls="panel-assist" aria-selected="true" data-service="assist">Assist</button>
        <button class="tab" id="tab-billboard" role="tab" type="button"
                aria-controls="panel-billboard" aria-selected="false" data-service="billboard" tabindex="-1">Billboard</button>
        <button class="tab" id="tab-calendar" role="tab" type="button"
                aria-controls="panel-calendar" aria-selected="false" data-service="calendar" tabindex="-1">Calendar</button>
        <button class="tab" id="tab-messages" role="tab" type="button"
                aria-controls="panel-messages" aria-selected="false" data-service="messages" tabindex="-1">Messages</button>
      </div>

      <!-- Assist — current Passport detection and access flow (unchanged) -->
      <section class="tab-panel" id="panel-assist" role="tabpanel" aria-labelledby="tab-assist" tabindex="0">

        <!-- DID field — shown as soon as a passport is detected -->
        <div class="field">
          <label>Your DID</label>
          <div id="didDisplay" class="did-display empty">Checking this device…</div>
        </div>

        <!-- Unlock field — shown only if a vault is present and locked -->
        <div class="field" id="unlockField" style="display:none">
          <label>Vault password</label>
          <input id="pwInput" class="pw-input" type="password" placeholder="Your passport password" autocomplete="current-password">
          <button id="unlockBtn" class="btn btn-gold" style="margin-top:10px">
            <span id="unlockBtnLabel">Unlock →</span>
          </button>
        </div>

        <div class="divider" id="doorsDivider" style="display:none">your doors</div>

        <!-- Doors — the vine answers with the services open to this DID -->
        <div class="field" id="doorsField" style="display:none">
          <div id="doorsList" class="doors-list"></div>
        </div>

        <div id="msgBox" class="msg"></div>

      </section>

      <!-- Billboard — public read (no Passport) + signed public create -->
      <section class="tab-panel" id="panel-billboard" role="tabpanel" aria-labelledby="tab-billboard" tabindex="0" hidden>

        <div class="bb-toolbar">
          <button class="btn btn-ghost" id="bbRefreshBtn" type="button">Refresh</button>
          <button class="btn btn-gold" id="bbNewBtn" type="button" style="display:none;">New post</button>
        </div>
        <p class="bb-note" id="bbCreateHint">Open your Passport to publish</p>

        <div id="bbStatus" class="bb-status" style="display:none;"></div>
        <div id="bbList" class="bb-list"></div>

        <!-- Composer — scope is fixed to public in this pass -->
        <form id="bbForm" class="bb-form" style="display:none;" onsubmit="return false;">
          <div class="field">
            <label>Title <span class="bb-count" id="bbTitleCount">0 / 160</span></label>
            <input id="bbTitle" class="did-input" type="text" maxlength="160" autocomplete="off">
          </div>
          <div class="field">
            <label>Message <span class="bb-count" id="bbBodyCount">0 / 5000</span></label>
            <textarea id="bbBody" class="bb-textarea" rows="5" maxlength="5000"></textarea>
          </div>
          <div class="field">
            <label>Optional expiration</label>
            <input id="bbExpires" class="did-input" type="datetime-local">
          </div>
          <div id="bbFormError" class="msg" style="display:none;"></div>
          <div class="bb-actions">
            <button class="btn btn-ghost" id="bbCancelBtn" type="button">Cancel</button>
            <button class="btn btn-gold" id="bbReviewBtn" type="button">Review &amp; sign →</button>
          </div>
        </form>

        <!-- Confirmation card — required before signing -->
        <div id="bbConfirm" class="bb-confirm" style="display:none;">
          <p class="cred-type">Confirm announcement</p>
          <div class="bb-confirm-row"><span>Scope</span><strong>Public</strong></div>
          <div class="bb-confirm-row"><span>Title</span><strong id="bbConfirmTitle"></strong></div>
          <div class="bb-confirm-row"><span>Message</span><div id="bbConfirmBody"></div></div>
          <div class="bb-confirm-row" id="bbConfirmExpRow" style="display:none;"><span>Expires</span><strong id="bbConfirmExp"></strong></div>
          <div id="bbConfirmError" class="msg" style="display:none;"></div>
          <div class="bb-actions" style="margin-top:12px;">
            <button class="btn btn-ghost" id="bbBackBtn" type="button">Back</button>
            <button class="btn btn-gold" id="bbSignBtn" type="button">Sign &amp; publish</button>
          </div>
        </div>

      </section>

      <section class="tab-panel" id="panel-calendar" role="tabpanel" aria-labelledby="tab-calendar" tabindex="0" hidden>
        <p class="service-soon">Service in preparation</p>
      </section>

      <section class="tab-panel" id="panel-messages" role="tabpanel" aria-labelledby="tab-messages" tabindex="0" hidden>
        <p class="service-soon">Service in preparation</p>
      </section>

      <div class="footer-note">
        <em>The math is the authority. Not the institution.</em><br>
        <a href="../passport/passport.html">Open your Passport →</a>
      </div>

    </div>
  </div>

<script src="portail.js"></script>
</body>
</html>
