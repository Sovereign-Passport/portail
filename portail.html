<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPID — Universal Switchboard</title>
<link rel="stylesheet" href="portail.css">
</head>
<body>

  <div class="bg-wrap">
    <img src="portal-bg.png" alt="SPID Portal">
  </div>

  <div class="content">
    <div class="panel">

      <div class="brand">
        <div class="mark">SPID</div>
        <h1>Universal Switchboard</h1>
        <div class="sub">Portal to sovereign services</div>
      </div>

      <!-- DID field — shown as soon as a passport is detected -->
      <div class="field">
        <label>Your DID</label>
        <div id="didDisplay" class="did-display empty">Checking this device…</div>
      </div>

      <!-- Unlock field — shown only if a vault is present and locked -->
      <div class="field" id="unlockField" style="display:none">
        <label>Vault password</label>
        <input id="pwInput" class="pw-input" type="password" placeholder="Your passport password" autocomplete="current-password">
        <button id="unlockBtn" class="btn btn-gold" style="margin-top:10px">
          <span id="unlockBtnLabel">Unlock →</span>
        </button>
      </div>

      <div class="divider" id="svcDivider" style="display:none">then choose a service</div>

      <!-- Service + Enter — shown only after successful unlock -->
      <div class="field" id="svcField" style="display:none">
        <label>Service</label>
        <select id="svcSelect" class="svc-select">
          <option value="orbit">Agents — AI</option>
          <option value="nugget">Nugget — Finance</option>
          <option value="billboard">Billboard — Chat</option>
          <option value="spid">SPID — Vines</option>
          <option value="sentinel">Sentinel — Cams</option>
        </select>
      </div>

      <button id="enterBtn" class="btn btn-gold" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 10 4 15 9 20"></polyline>
          <path d="M20 4v7a4 4 0 0 1-4 4H4"></path>
        </svg>
        <span id="enterBtnLabel">Enter</span>
      </button>

      <div id="msgBox" class="msg"></div>
      <div id="resultBox" class="result-box"></div>

      <div class="footer-note">
        <em>The math is the authority. Not the institution.</em><br>
        <a href="../passport/passport.html">Open your Passport →</a>
      </div>

    </div>
  </div>

<script src="portail.js"></script>
</body>
</html>
